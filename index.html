<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Desk Robot</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" href="./icon.png" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #face {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 75px;
      transition: transform 0.45s cubic-bezier(0.25, 1, 0.5, 1);
      will-change: transform;
    }
    .eye {
      width: 85px;
      height: 135px;
      background-color: #ffffff;
      border-radius: 50%;
      transition: transform 0.11s ease-in-out;
      will-change: transform;
    }
    .eye.blink {
      transform: scaleY(0.04);
    }
  </style>
</head>
<body>
  <div id="face">
    <div class="eye"></div>
    <div class="eye"></div>
  </div>

  <script>
    const face = document.getElementById('face');
    const eyes = document.querySelectorAll('.eye');
    let isBlinking = false;

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    function goFullScreen() {
      const el = document.documentElement;
      if (!document.fullscreenElement) {
        el.requestFullscreen().catch(() => {});
      }
      if ('wakeLock' in navigator) {
        navigator.wakeLock.request('screen').catch(() => {});
      }
    }

    function triggerBlink() {
      goFullScreen();
      if (isBlinking) return;
      isBlinking = true;
      eyes.forEach(eye => eye.classList.add('blink'));
      setTimeout(() => {
        eyes.forEach(eye => eye.classList.remove('blink'));
        setTimeout(() => { isBlinking = false; }, 120);
      }, 130);
    }

    function moveEyes() {
      const maxX = Math.min(window.innerWidth * 0.28, 120);
      const maxY = Math.min(window.innerHeight * 0.25, 110);
      const x = (Math.random() * 2 - 1) * maxX;
      const y = (Math.random() * 2 - 1) * maxY;
      face.style.transform = `translate(${x}px, ${y}px)`;

      const nextDelay = 550 + Math.random() * 900;
      setTimeout(moveEyes, nextDelay);
    }

    document.addEventListener('click', triggerBlink);

    setTimeout(moveEyes, 500);
  </script>
</body>
</html>
